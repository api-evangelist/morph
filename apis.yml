aid: morph
name: Morph
description: >-
  Morph is an Optimistic zkEVM Ethereum Layer-2 blockchain (chain id 2818) focused
  on consumer-facing applications, backed by Pantera Capital. Its modular design
  combines a decentralized sequencer network with a Responsive Validity Proof
  system. Developers integrate with Morph through an Ethereum-compatible JSON-RPC
  API (rpc.morph.network) that adds Morph-specific methods, a Blockscout block
  explorer REST/GraphQL API (explorer-api.morph.network), the official
  @morph-l2/sdk JavaScript library, and an official AI Agent Skill and CLI
  (morph-l2/morph-skill) covering wallet operations, DEX swaps, cross-chain
  bridging, EIP-8004 agent identity and reputation, alternative-token gas payment,
  EIP-7702 delegation, and the x402 HTTP payment protocol.
